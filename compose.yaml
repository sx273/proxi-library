services:
  proxi-library:
    build: .
    container_name: proxi-library
    restart: unless-stopped
    shm_size: "512m"
    ports:
      - "${APP_PORT:-6067}:6067"
    environment:
      LUCIDADL_HOME: /data/lucidadl
      DASHBOARD_DATA: /data/dashboard
      MUSIC_ROOT: /music
    volumes:
      - "${MUSIC_LIBRARY_PATH:-./music}:/music"
      - "${APP_DATA_PATH:-./app-data}:/data"